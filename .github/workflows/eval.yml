name: Scoring eval

on:
  # Pull requests and main only: a working-branch push of the same change
  # would spend another run of model calls (shared subscription) on
  # identical inputs.
  pull_request:
    paths:
      - "profile.md"
      - "feedback.md"
      - "src/triage.py"
      - "src/screen.py"
      - "src/eval_runner.py"
      - "eval/**"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "profile.md"
      - "feedback.md"
      - "src/triage.py"
      - "src/screen.py"
      - "src/eval_runner.py"
      - "eval/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run scoring and screen evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m src.eval_runner
